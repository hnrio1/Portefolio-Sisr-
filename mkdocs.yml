site_name: Portfolio SISR — Henrio Chambal
site_url: https://hnrio1.github.io/Portefolio-Sisr-/
site_description: Portfolio BTS SIO SISR — Henrio Chambal
site_author: Henrio Chambal

theme:
  name: material
  language: fr
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Mode clair
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Mode sombre
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

repo_url: https://github.com/hnrio1/Portefolio-Sisr-
repo_name: Portfolio GitHub

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hnrio1
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/henrio-chambal-b185361a8/

nav:
  - Accueil: index.md
  - E5 - Support:
    - Supervision Nagios: E5-Support/nagios/README.md
    - Messagerie Zimbra: E5-Support/zimbra/README.md
    - RADIUS WiFi: E5-Support/mission-6-radius-wifi/README.md
    - SSH: E5-Support/ssh/README.md
    - Missions StadiumCompany: E5-Support/missions-stadiumcompany/README.md
    - Active Directory: E5-Support/active-directory/README.md
    - HAProxy & HeartBeat: E5-Support/mission-4-haproxy-heartbeat/README.md
    - Pare-feu pfSense: E5-Support/pfsense/README.md
  - E6 - Admin Reseau:
    - GLPI & OCS Inventory: E6-Admin-Reseau/theme-15/README.md
  - E7 - Cybersecurite:
    - Snort IDS/IPS: E7-Cybersecurite/snort-ids/README.md
    - VPN Site-to-Site: E7-Cybersecurite/vpn-site-to-site/README.md
  - Stages:
    - Pasteur - Nextcloud Ansible: Stage/pasteur/nextcloud-ansible/README.md
    - CECCA - Scripts extraction: Stage/cecca/scripts-extraction/README.md
  - Projets Perso:
    - Diagnostic reseau: Projets-Perso/diagnostic-reseau/README.md
    - Script de backup: Projets-Perso/script-backup/README.md
  - Tableau de synthese: Tableau-de-synthese/README.md
  - Veille Technologique:
    - Presentation: Veille-Technologique/README.md
    - Dispositif de veille: Veille-Technologique/Dispositif-de-veille.md
    - Etude MITRE ATT&CK: Veille-Technologique/Etude-MITRE-ATTCK.md
    - Fiches de veille:
      - OpenSSH regreSSHion: Veille-Technologique/Fiches/2025-09-15-faille-openssh.md
      - XSS pfSense: Veille-Technologique/Fiches/2025-11-20-faille-pfsense-xss.md
      - Zerologon AD: Veille-Technologique/Fiches/2026-01-10-faille-windows-ad.md
      - Path Traversal Apache: Veille-Technologique/Fiches/2026-03-05-faille-apache-path-traversal.md

docs_dir: docs

markdown_extensions:
  - tables
  - attr_list
  - def_list
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/extra.js

plugins:
  - search
